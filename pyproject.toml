[project]
name = "janggi-ai"
version = "0.4.0"
description = "Janggi (Korean chess) analysis engine: rules, alpha-beta search, all-legal-moves win-rate analysis, web UI"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "websockets>=12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:warnings"
