# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- App identity (change these before publishing; nothing else needs to move) ----
# Play Store package name. The Kotlin namespace stays com.example.janggiai (JNI symbols depend on it).
janggi.applicationId=com.example.janggiai
janggi.versionCode=2
janggi.versionName=1.1.0

# Native ABIs packaged into the AAB (arm64-v8a is what real phones use; x86_64 for the emulator).
janggi.abis=arm64-v8a,x86_64

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
